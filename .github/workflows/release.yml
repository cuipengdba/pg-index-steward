name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18, 19]
        platform:
          - {runner: ubuntu-22.04, arch: x86_64}
          - {runner: ubuntu-22.04-arm, arch: aarch64}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install matching PostgreSQL headers and binaries
        env:
          PG_MAJOR: ${{ matrix.pg }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt jammy-pgdg main' | sudo tee /etc/apt/sources.list.d/steward-pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "postgresql-$PG_MAJOR" "postgresql-server-dev-$PG_MAJOR"
      - name: Build and check indexing policies
        env:
          PG_MAJOR: ${{ matrix.pg }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          set -euo pipefail
          pgconfig="/usr/lib/postgresql/$PG_MAJOR/bin/pg_config"
          make PG_CONFIG="$pgconfig"
          mkdir -p "payload/$ARCH/pg$PG_MAJOR"
          cp pg_index_steward.so "payload/$ARCH/pg$PG_MAJOR/"
          sudo bash ./install.sh --files-only --pg-config "$pgconfig"
          bash tests/integration.sh "$pgconfig"
          bash tests/recovery.sh "$pgconfig"
          bash tests/failover.sh "$pgconfig"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform.arch }}-pg${{ matrix.pg }}
          path: payload/${{ matrix.platform.arch }}/pg${{ matrix.pg }}/pg_index_steward.so
          if-no-files-found: error

  timescale:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
        pair:
          - {pg: '14.19', ts: '2.8.0', experimental: 'OFF'}
          - {pg: '14.25', ts: '2.19.3', experimental: 'OFF'}
          - {pg: '15.20', ts: '2.19.3', experimental: 'OFF'}
          - {pg: '16.16', ts: '2.32.1', experimental: 'OFF'}
          - {pg: '17.12', ts: '2.32.1', experimental: 'OFF'}
          - {pg: '18.7', ts: '2.32.1', experimental: 'OFF'}
          - {pg: '19.0', ts: '2.32.1', experimental: 'ON'}
    env:
      FIXTURE: /tmp/pgis-timescale-${{ matrix.pair.pg }}-${{ matrix.pair.ts }}
      FIXTURE_PG: ${{ matrix.pair.pg }}
      FIXTURE_TS: ${{ matrix.pair.ts }}
      FIXTURE_EXPERIMENTAL: ${{ matrix.pair.experimental }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache isolated TimescaleDB fixture
        id: fixture
        uses: actions/cache@v4
        with:
          path: ${{ env.FIXTURE }}
          key: timescale-${{ env.FIXTURE_TS }}-pg${{ env.FIXTURE_PG }}-${{ matrix.runner }}-${{ hashFiles('scripts/build-timescale-fixture.sh') }}
      - name: Build isolated TimescaleDB fixture
        if: steps.fixture.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bison flex liblz4-dev libzstd-dev
          bash scripts/build-timescale-fixture.sh "$FIXTURE" "$FIXTURE_PG" "$FIXTURE_TS" "$FIXTURE_EXPERIMENTAL"
      - name: Verify real hypertable index creation
        run: |
          set -euo pipefail
          pgconfig="$FIXTURE/bin/pg_config"
          make PG_CONFIG="$pgconfig" install
          if [[ $FIXTURE_TS == 2.8.0 ]]; then
            bash tests/timescale.sh "$pgconfig"
            bash tests/failover.sh "$pgconfig" timescale
          else
            bash tests/timescale-matrix.sh "$pgconfig" "$FIXTURE_TS" "$FIXTURE_EXPERIMENTAL"
            if [[ $FIXTURE_TS == 2.32.1 && $FIXTURE_EXPERIMENTAL == OFF ]]; then
              bash tests/hypercore.sh "$pgconfig"
            fi
          fi

  package:
    needs: [verify, timescale]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: binary-*
      - name: Assemble bundles and SHA-256 checksums
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v$(sed -n "s/^default_version = '\(.*\)'$/\1/p" pg_index_steward.control)"
          for arch in x86_64 aarch64; do
            for major in {14..19}; do
              mkdir -p "stage/$arch/pg$major"
              cp "binaries/binary-$arch-pg$major/pg_index_steward.so" "stage/$arch/pg$major/"
            done
            bash scripts/package.sh "$arch" "stage/$arch"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Check both offline installation archives
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          for arch in x86_64 aarch64; do
            name="pg-index-steward-${GITHUB_REF_NAME#v}-linux-$arch"
            tar -xzf "dist/$name.tar.gz"
            (
              cd "$name"
              sha256sum -c SHA256SUMS
              test -x install.sh
              bash -n install.sh
              test -f assets/steward.svg
              test "$(bin/pg-index-steward --version)" = "PG Index Steward ${GITHUB_REF_NAME#v}"
              python3 - "$arch" <<'PY'
          import pathlib
          import struct
          import sys

          arch = sys.argv[1]
          for major in range(14, 20):
              binary = pathlib.Path(f'payload/{arch}/pg{major}/pg_index_steward.so')
              elf = binary.read_bytes()[:20]
              assert elf[:6] == b'\x7fELF\x02\x01', binary
              assert struct.unpack_from('<H', elf, 18)[0] == {'x86_64': 62, 'aarch64': 183}[arch], binary
          PY
            )
          done
      - name: Sign build provenance
        id: provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'dist/*.tar.gz'
      - name: Verify signed build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" dist/provenance.jsonl
          for archive in dist/*.tar.gz; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" --bundle dist/provenance.jsonl --deny-self-hosted-runners
          done
      - name: Publish native-tested release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS dist/provenance.jsonl --clobber
          elif [[ "$GITHUB_REF_NAME" != *-* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS dist/provenance.jsonl --verify-tag --latest --title "PG Index Steward ${GITHUB_REF_NAME#v}" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS dist/provenance.jsonl --verify-tag --generate-notes --prerelease
          fi
